name: Check repository source
description: Audit APM and lint workflow and Markdown source.

runs:
  using: composite
  steps:
    - name: Set up reviewed APM CLI
      uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
      with:
        apm-version: "0.27.0"
        setup-only: "true"
    - name: Audit APM deployment
      shell: bash
      run: apm audit --ci
    - name: Install checksum-verified workflow tools
      shell: bash
      run: bash "${{ github.action_path }}/install-workflow-tools.sh"
    - name: Lint workflow source
      shell: bash
      run: |-
        actionlint
        pinact run --verify
    - name: Lint Markdown source
      uses: DavidAnson/markdownlint-cli2-action@ce4853d43830c74c1753b39f3cf40f71c2031eb9 # v23.0.0
      with:
        config: .markdownlint-cli2.yaml
        globs: "**/*.md"
    - name: Remove workflow tools
      if: always()
      shell: bash
      run: rm -rf -- "${RUNNER_TEMP}"/workflow-tools.*
